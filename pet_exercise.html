<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>運動偵測狗狗動畫</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"DFKai-SB","標楷體",sans-serif;
}

body{
    background:#d8c5a9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    overflow:auto;
}

.container{
    width:100%;
    max-width:500px;
    text-align:center;
}

/* 標題 */

.title{
    font-size:42px;
    margin-bottom:20px;
    color:#000;
}

/* 畫面區 
.scene{
    width:100%;
    background:#24345f;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    aspect-ratio:4 / 5;

    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}
*/

/* 圖片 */

.scene img{
    width:100%;
    height:auto;
    object-fit:cover;
    display:block;
    
    
}

/* 影片 */

.scene video{
    width:100%;
    height:auto;
    object-fit:cover;
    display:none;
}

/* 資訊區 */

.info{
    margin-top:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:30px;
    gap:10px;
    flex-wrap:wrap;
}

#status{
    margin-top:20px;
    font-size:26px;
    font-weight:bold;
    min-height:40px;
}

/* 按鈕 */

button{
    margin-top:30px;
    padding:18px 40px;
    font-size:24px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#ececec;
    transition:0.3s;
    max-width:100%;
}

button:hover{
    background:#d7d7d7;
}

/* 平板 */

@media(max-width:768px){

    .container{
        max-width:90%;
    }

    .title{
        font-size:34px;
    }

    .info{
        font-size:24px;
    }

    #status{
        font-size:22px;
    }

    button{
        width:100%;
        font-size:22px;
    }
}

/* 小手機 */

@media(max-width:480px){

    body{
        padding:12px;
    }

    .title{
        font-size:28px;
    }

    .info{
        font-size:20px;
        justify-content:center;
        flex-direction:column;
    }

    #status{
        font-size:18px;
    }

    button{
        font-size:20px;
        padding:16px;
    }
}

/* 橫向手機 */

@media screen and (orientation: landscape) and (max-height:600px){

    body{
        align-items:flex-start;
        padding:10px;
    }

    .container{
        max-width:100%;
    }

    .title{
        font-size:24px;
        margin-bottom:10px;
    }

    .scene{
        aspect-ratio:16/9;
        max-height:60vh;
    }

    .info{
        margin-top:15px;
        font-size:18px;
    }

    #status{
        margin-top:10px;
        font-size:16px;
    }

    button{
        margin-top:15px;
        font-size:18px;
        padding:12px 20px;
    }
}

/* =========================
   喝水提醒視窗
========================= */

#waterPopup{

    /* 固定在整個畫面 */
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    /* 半透明黑背景 */
    background:rgba(0,0,0,0.5);

    /* 預設隱藏 */
    display:none;

    /* 置中 */
    justify-content:center;
    align-items:center;

    z-index:999;
}

/* 白色提醒框 */

.popupBox{

    width:80%;
    max-width:320px;

    background:white;

    padding:30px;

    border-radius:20px;

    text-align:center;
}

/* 標題 */

.popupBox h2{

    font-size:32px;

    margin-bottom:20px;
}

/* 內容 */

.popupBox p{

    font-size:24px;

    margin-bottom:25px;
}

/* 按鈕 */

.popupBox button{

    padding:12px 30px;

    font-size:24px;

    border:none;

    border-radius:12px;

    background:#ececec;
}
</style>
</head>

<body>

<div class="container">

    <!-- 標題 -->

    <h1 class="title">
        運動狗狗偵測
    </h1>

    <!-- 畫面區 -->

    <div class="scene">

        <!-- 靜態圖片 -->

        <img id="dogImage" src="" alt="dog">

        <!-- 動畫影片 -->

        <video id="dogVideo" muted loop playsinline webkit-playsinline>
            <source id="videoSource" src="" type="video/mp4">
        </video>

    </div>

    <!-- 資訊 -->

    <div class="info">

        <div>
            運動時長:
        </div>

        <div id="timeText">
            0 分鐘
        </div>

    </div>

    <!-- 狀態 -->

    <div id="status">
        等待感測器啟動...
    </div>

    <!-- 按鈕 -->

    <button onclick="requestMotionPermission()">
        開始偵測運動
    </button>

</div>

<script>

const dogImage = document.getElementById("dogImage");

const dogVideo = document.getElementById("dogVideo");

const videoSource = document.getElementById("videoSource");

const statusText = document.getElementById("status");

const timeText = document.getElementById("timeText");

let lastMoveTime = Date.now();

let exerciseSeconds = 0;

let isMoving = false;
let lastState = false; //加入變數，希望只有改變狀態的時候再切換動畫
let hasShownWaterReminder = false;

/*
    判斷是否白天
*/

function isDayTime(){

    const hour = new Date().getHours();

    return hour >= 6 && hour < 18;
}

/*
    更新畫面
*/

function updateDisplay(){

    /*
        白天
    */

    if(isDayTime()){

        /*
            有運動
        */

        if(isMoving){

            videoSource.src = "./dog_exercising_morning.mp4";
            dogVideo.load();

            dogImage.style.display = "none";
            dogVideo.style.display = "block";

            dogVideo.onloadeddata = async () => {
                try {
                    await dogVideo.play();
                } catch (e) {
                    console.log(e);
                }
            };
        }else{

            /*
                沒有運動
            */

            dogVideo.pause();
            dogImage.src = "./dog_stop_morning.png";
            dogImage.style.display = "block";
            dogVideo.style.display = "none";
        }

    }else{

        /*
            晚上
        */

        if(isMoving){

            videoSource.src = "./dog_exercising_night.mp4";
            dogVideo.load();

            dogImage.style.display = "none";
            dogVideo.style.display = "block";

            dogVideo.onloadeddata = async () => {
            try {
                await dogVideo.play();
            } catch (e) {
                console.log(e);
            }
        };

        }else{

            dogImage.src =
                "dog_stop_night.png";

            dogImage.style.display = "block";
            dogVideo.style.display = "none";

            dogVideo.pause();
        }
    }
}
/* =========================
   喝水提醒功能
========================= */

function showWaterReminder(){

    /*
        手機震動
        500 = 震動0.5秒
    */

    if(navigator.vibrate){

        navigator.vibrate(500);
    }

    /*
        顯示提醒視窗
    */

    document
        .getElementById("waterPopup")
        .style.display = "flex";
}

/*
    關閉提醒視窗
*/

function closePopup(){

    document
        .getElementById("waterPopup")
        .style.display = "none";
}
/*
    初始化畫面
*/

updateDisplay();

/*
    啟動手機感測器
*/

function requestMotionPermission(){

    if(typeof DeviceMotionEvent !== "undefined" &&
       typeof DeviceMotionEvent.requestPermission === "function"){

        DeviceMotionEvent.requestPermission()
        .then(permissionState => {

            if(permissionState === "granted"){

                startMotionDetection();

            }else{

                statusText.innerHTML =
                    "感測器權限被拒絕";
            }

        })
        .catch(error => {

            console.log(error);

        });

    }else{

        startMotionDetection();
    }
}

/*
    開始偵測
*/

function startMotionDetection(){

    statusText.innerHTML =
        "開始偵測運動...";

    window.addEventListener("devicemotion", function(event){

        let x =
            event.accelerationIncludingGravity.x || 0;

        let y =
            event.accelerationIncludingGravity.y || 0;

        let z =
            event.accelerationIncludingGravity.z || 0;

        /*
            計算移動強度
        */

        let totalMovement =
            Math.abs(x) +
            Math.abs(y) +
            Math.abs(z);

        console.log(totalMovement);

        /*
            閾值
            越小越敏感
        */

        if(totalMovement > 15){

        lastMoveTime = Date.now();

        if(!isMoving){

            isMoving = true;

            statusText.innerHTML = "偵測到運動中！";

            updateDisplay();
        }
        }

    });

    /*
        超過1秒沒移動
    */

    setInterval(()=>{

        let currentTime = Date.now();

        if(currentTime - lastMoveTime > 1000){

            if(isMoving){

                if(isMoving){

                    isMoving = false;

                    statusText.innerHTML = "目前沒有運動";

                    updateDisplay();
                }
            }
        }

    },200);

    /*
        計算運動時間
    */

    setInterval(()=>{

        if(isMoving){

            exerciseSeconds++;
            /*
                30分鐘提醒喝水
                30分鐘 = 1800秒
                先改成60秒
            */

            if(
                exerciseSeconds >= 60 &&
                !hasShownWaterReminder
            ){

                /*
                    標記已提醒
                    避免一直跳出
                */

                hasShownWaterReminder = true;

                /*
                    顯示提醒
                */

                showWaterReminder();
            }

            let minutes =
                Math.floor(exerciseSeconds / 60);

            if(minutes < 60){

                timeText.innerHTML =
                    minutes + " 分鐘";

            }else{

                let hours =
                    Math.floor(minutes / 60);

                let remainMinutes =
                    minutes % 60;

                timeText.innerHTML =
                    hours + " 小時 " +
                    remainMinutes + " 分鐘";
            }
        }

    },1000);

}

/*
    每分鐘重新判斷日夜
*/

setInterval(()=>{

    updateDisplay();

},60000);

</script>
<!-- =========================
     喝水提醒視窗
========================= -->

<div id="waterPopup">

    <div class="popupBox">

        <h2>
            溫馨提醒💧
        </h2>

        <p>
            要記得補充水分喔～
        </p>

        <button onclick="closePopup()">
            好
        </button>

    </div>

</div>
</body>
</html>
