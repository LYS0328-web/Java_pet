<!DOCTYPE html>
<html lang="zh-Hant">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>運動偵測狗狗動畫</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"DFKai-SB","標楷體",sans-serif;
}

body{
    background:#d8c5a9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    overflow:auto;
}

.container{
    width:100%;
    max-width:500px;
    text-align:center;
}

.title{
    font-size:42px;
    margin-bottom:20px;
    color:#000;
}

.scene img{
    width:100%;
    height:auto;
    object-fit:cover;
    display:block;
}

.scene video{
    width:100%;
    height:auto;
    object-fit:cover;
    display:none;
}

.info{
    margin-top:25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:30px;
    gap:10px;
    flex-wrap:wrap;
}

#status{
    margin-top:20px;
    font-size:26px;
    font-weight:bold;
    min-height:40px;
}

button{
    margin-top:30px;
    padding:18px 40px;
    font-size:24px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#ececec;
    transition:0.3s;
    max-width:100%;
}

button:hover{
    background:#d7d7d7;
}

/* 平板 */

@media(max-width:768px){

    .container{
        max-width:90%;
    }

    .title{
        font-size:34px;
    }

    .info{
        font-size:24px;
    }

    #status{
        font-size:22px;
    }

    button{
        width:100%;
        font-size:22px;
    }
}

/* 小手機 */

@media(max-width:480px){

    body{
        padding:12px;
    }

    .title{
        font-size:28px;
    }

    .info{
        font-size:20px;
        justify-content:center;
        flex-direction:column;
    }

    #status{
        font-size:18px;
    }

    button{
        font-size:20px;
        padding:16px;
    }
}

/* 橫向手機 */

@media screen and (orientation: landscape) and (max-height:600px){

    body{
        align-items:flex-start;
        padding:10px;
    }

    .container{
        max-width:100%;
    }

    .title{
        font-size:24px;
        margin-bottom:10px;
    }

    .info{
        margin-top:15px;
        font-size:18px;
    }

    #status{
        margin-top:10px;
        font-size:16px;
    }

    button{
        margin-top:15px;
        font-size:18px;
        padding:12px 20px;
    }
}

/* =========================
   喝水提醒視窗
========================= */

#waterPopup{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:rgba(0,0,0,0.5);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999;
}

.popupBox{

    width:80%;
    max-width:320px;

    background:white;

    padding:30px;

    border-radius:20px;

    text-align:center;
}

.popupBox h2{

    font-size:32px;

    margin-bottom:20px;
}

.popupBox p{

    font-size:24px;

    margin-bottom:25px;
}

.popupBox button{

    padding:12px 30px;

    font-size:24px;

    border:none;

    border-radius:12px;

    background:#ececec;
}

</style>
</head>

<body>

<div class="container">

    <h1 class="title">
        和狗狗一起運動吧~
    </h1>

    <div class="scene">

        <!-- 靜態圖片 -->

        <img id="dogImage" src="" alt="dog">

        <!-- 動畫影片 -->

        <video
            id="dogVideo"
            muted
            loop
            playsinline
            webkit-playsinline>

            <source
                id="videoSource"
                src=""
                type="video/mp4">

        </video>

    </div>

    <div class="info">

        <div>
            運動時長:
        </div>

        <div id="timeText">
            0 分鐘
        </div>

    </div>

    <div id="status">
        等待感測器啟動...
    </div>

    <button onclick="requestMotionPermission()">
        開始運動
    </button>

</div>

<!-- =========================
     喝水提醒視窗
========================= -->

<div id="waterPopup">

    <div class="popupBox">

        <h2>
            溫馨提醒💧
        </h2>

        <p>
            要記得補充水分喔～
        </p>

        <button onclick="closePopup()">
            好
        </button>

    </div>

</div>

<script>

const dogImage =
    document.getElementById("dogImage");

const dogVideo =
    document.getElementById("dogVideo");

const videoSource =
    document.getElementById("videoSource");

const statusText =
    document.getElementById("status");

const timeText =
    document.getElementById("timeText");

let lastMoveTime =
    Date.now();

let exerciseSeconds =
    0;

let isMoving =
    false;

let hasShownWaterReminder =
    false;

/*
    避免影片重複 load 閃爍
*/

let currentVideo =
    "";

/*
    判斷是否白天
*/

function isDayTime(){

    const hour =
        new Date().getHours();

    return hour >= 6 && hour < 18;
}

/*
    切換影片
*/

async function changeVideo(newVideo){

    /*
        如果影片相同
        不重新載入
    */

    if(currentVideo === newVideo){

        return;
    }

    currentVideo = newVideo;

    videoSource.src = newVideo;

    dogVideo.load();

    dogImage.style.display =
        "none";

    dogVideo.style.display =
        "block";

    dogVideo.onloadeddata =
    async () => {

        try{

            await dogVideo.play();

        }catch(e){

            console.log(e);
        }
    };
}

/*
    更新畫面
*/

function updateDisplay(){

    /*
        白天
    */

    if(isDayTime()){

        /*
            有運動
        */

        if(isMoving){

            let newVideo = "";

            /*
                1小時以上
                (測試版先改180秒)
            */

            if(exerciseSeconds >= 180){

                newVideo =
                    "./dog_adult_morning.mp4";

            }

            /*
                30分鐘以上
                (測試版先改120秒)
            */

            else if(exerciseSeconds >= 120){

                newVideo =
                    "./dog_teen_morning.mp4";

            }

            /*
                一般狀態
            */

            else{

                newVideo =
                    "./dog_exercising_morning.mp4";
            }

            changeVideo(newVideo);

        }else{

            /*
                沒有運動
            */

            dogVideo.pause();

            currentVideo = "";

            dogImage.src =
                "./dog_stop_morning.png";

            dogImage.style.display =
                "block";

            dogVideo.style.display =
                "none";
        }

    }else{

        /*
            晚上
        */

        if(isMoving){

            let newVideo = "";

            if(exerciseSeconds >= 180){

                newVideo =
                    "./dog_adult_night.mp4";

            }else if(exerciseSeconds >= 120){

                newVideo =
                    "./dog_teen_night.mp4";

            }else{

                newVideo =
                    "./dog_exercising_night.mp4";
            }

            changeVideo(newVideo);

        }else{

            dogVideo.pause();

            currentVideo = "";

            dogImage.src =
                "./dog_stop_night.png";

            dogImage.style.display =
                "block";

            dogVideo.style.display =
                "none";
        }
    }
}

/* =========================
   喝水提醒功能
========================= */

function showWaterReminder(){

    /*
        手機震動
    */

    if(navigator.vibrate){

        navigator.vibrate([500,200,500]);
    }

    /*
        顯示提醒視窗
    */

    document
        .getElementById("waterPopup")
        .style.display = "flex";
}

/*
    關閉提醒視窗
*/

function closePopup(){

    document
        .getElementById("waterPopup")
        .style.display = "none";
}

/*
    初始化畫面
*/

updateDisplay();

/*
    啟動手機感測器
*/

function requestMotionPermission(){

    if(
        typeof DeviceMotionEvent !== "undefined"
        &&
        typeof DeviceMotionEvent
        .requestPermission === "function"
    ){

        DeviceMotionEvent
        .requestPermission()

        .then(permissionState => {

            if(permissionState === "granted"){

                startMotionDetection();

            }else{

                statusText.innerHTML =
                    "感測器權限被拒絕";
            }

        })

        .catch(error => {

            console.log(error);

        });

    }else{

        startMotionDetection();
    }
}

/*
    開始偵測
*/

function startMotionDetection(){

    statusText.innerHTML =
        "開始偵測運動...";

    /*
        感測器
    */

    window.addEventListener(
        "devicemotion",

        function(event){

        let x =
            event
            .accelerationIncludingGravity
            .x || 0;

        let y =
            event
            .accelerationIncludingGravity
            .y || 0;

        let z =
            event
            .accelerationIncludingGravity
            .z || 0;

        /*
            計算移動強度
        */

        let totalMovement =

            Math.abs(x) +
            Math.abs(y) +
            Math.abs(z);

        console.log(totalMovement);

        /*
            閾值
        */

        if(totalMovement > 15){

            lastMoveTime =
                Date.now();

            if(!isMoving){

                isMoving = true;

                statusText.innerHTML =
                    "偵測到運動中！";

                updateDisplay();
            }
        }
    });

    /*
        超過1秒沒移動
    */

    setInterval(()=>{

        let currentTime =
            Date.now();

        if(
            currentTime - lastMoveTime > 1000
        ){

            if(isMoving){

                isMoving = false;

                statusText.innerHTML =
                    "目前沒有運動";

                updateDisplay();
            }
        }

    },200);

    /*
        計算運動時間
    */

    setInterval(()=>{

        if(isMoving){

            exerciseSeconds++;

            /*
                更新畫面
            */

            updateDisplay();

            /*
                喝水提醒
                (測試版60秒)
            */

            if(
                exerciseSeconds >= 60
                &&
                !hasShownWaterReminder
            ){

                hasShownWaterReminder =
                    true;

                showWaterReminder();
            }

            /*
                顯示時間
            */

            let minutes =
                Math.floor(
                    exerciseSeconds / 60
                );

            if(minutes < 60){

                timeText.innerHTML =
                    minutes + " 分鐘";

            }else{

                let hours =
                    Math.floor(minutes / 60);

                let remainMinutes =
                    minutes % 60;

                timeText.innerHTML =

                    hours + " 小時 " +

                    remainMinutes + " 分鐘";
            }
        }

    },1000);
}

/*
    每分鐘重新判斷日夜
*/

setInterval(()=>{

    updateDisplay();

},60000);

</script>

</body>
</html>
